{{ define "head" }}
<meta name="description" content="{{ .Description }}">
{{ end }}
{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}
{{ define "main" }}
<main class="portfolio-page">
  <div class="portfolio-shell">
    <a class="portfolio-back" href="{{ "/#projects" | relURL }}">Back to projects</a>
    <header class="portfolio-intro">
      <p class="portfolio-eyebrow">{{ .Params.eyebrow }}</p>
      <h1>{{ .Title }}</h1>
      <p class="portfolio-lead">{{ .Description }}</p>
      {{ with .Params.repo }}<a class="btn" href="{{ . }}" target="_blank" rel="noopener noreferrer">View on GitHub</a>{{ end }}
    </header>
    <div class="portfolio-layout">
      <aside class="portfolio-toc" aria-label="On this page">
        <p>On this page</p>
        {{ .TableOfContents }}
      </aside>
      <article class="portfolio-content">{{ .Content }}</article>
    </div>
  </div>
</main>
{{ end }}
